<script>
/* 8비트 배경음악·효과음 (Web Audio 합성 · 외부 음원 없음 · 저작권 문제 없음) */
var Snd=(function(){
  var ctx=null,master=null,sfxBus=null,moodGain=null,mood=null,pending=null,step=0,nextT=0,sd=0.25,muted=false,noiseBuf=null;
  var VOL=0.9;
  try{ muted=(localStorage.getItem('muted')==='1'); }catch(e){}
  var hz=function(m){return 440*Math.pow(2,(m-69)/12);};
  var _=null;
  // 16스텝(8분음표 단위) 반복. 숫자=MIDI 음높이, null=쉼
  var MOODS={
    calm:{bpm:92,lw:'square',bw:'triangle',lv:0.07,bv:0.16,
      lead:[72,_,76,_,79,_,76,72, 74,_,76,_,69,_,67,_],
      bass:[48,_,55,_,43,_,50,_, 45,_,52,_,41,_,48,_]},
    tense:{bpm:108,lw:'sawtooth',bw:'triangle',lv:0.05,bv:0.18,hat:1,ld:0.5,
      lead:[_,_,76,_,_,_,75,_, _,_,76,_,_,_,71,_],
      bass:[45,45,45,45,45,45,45,45, 41,41,41,41,43,43,44,44]},
    alarm:{bpm:150,lw:'square',bw:'square',lv:0.07,bv:0.1,hat:2,kick:1,ld:1.8,
      lead:[81,_,81,_,76,_,76,_, 81,_,81,_,76,_,76,_],
      bass:[40,_,40,_,40,_,40,_, 40,_,40,_,41,_,41,_]},
    jail:{bpm:56,lw:'triangle',bw:'triangle',lv:0.1,bv:0.16,ld:3,bd:3,
      lead:[_,_,_,_,62,_,_,_, _,_,_,_,65,_,60,_],
      bass:[38,_,_,_,_,_,_,_, 34,_,_,_,_,_,_,_]},
    bright:{bpm:120,lw:'square',bw:'triangle',lv:0.07,bv:0.17,hat:2,
      lead:[72,76,79,76,72,76,79,84, 77,76,74,72,74,76,79,_],
      bass:[48,_,48,_,43,_,43,_, 45,_,45,_,41,_,43,_]}
  };
  function moodOf(n){ return n<=4?'calm':n<=11?'tense':n<=14?'alarm':n<=17?'jail':n<=19?'calm':'bright'; }
  var SCENE_SFX={6:'ding',7:'flag',9:'heart',12:'siren',14:'arrest',15:'cell',18:'rewind',21:'flag',23:'clear'};

  function tone(dest,type,f,t,dur,vol,slideTo){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.05);
  }
  function noise(dest,t,dur,vol,hp){
    var s=ctx.createBufferSource(); s.buffer=noiseBuf;
    var f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    var g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+0.02);
  }
  function playStep(m,i,t){
    var L=m.lead[i],B=m.bass[i];
    if(L!==null) tone(moodGain,m.lw,hz(L),t,sd*(m.ld||0.9),m.lv);
    if(B!==null) tone(moodGain,m.bw,hz(B),t,sd*(m.bd||0.95),m.bv);
    if(m.hat && i%m.hat===0) noise(moodGain,t,0.04,0.03,7000);
    if(m.kick && i%4===0) tone(moodGain,'sine',140,t,0.14,0.2,45);
  }
  function schedule(until){
    var m=MOODS[mood]; if(!m||!ctx) return;
    while(nextT<until){ playStep(m,step,nextT); nextT+=sd; step=(step+1)%16; }
  }
  function setMood(name){
    if(!ctx){ pending=name; return; }
    if(name===mood) return;
    var t=ctx.currentTime;
    if(moodGain){
      var old=moodGain;
      old.gain.cancelScheduledValues(t); old.gain.setValueAtTime(old.gain.value,t); old.gain.linearRampToValueAtTime(0,t+0.5);
      setTimeout(function(){ try{old.disconnect();}catch(e){} },1000);
    }
    moodGain=ctx.createGain(); moodGain.gain.setValueAtTime(0,t); moodGain.gain.linearRampToValueAtTime(1,t+0.4); moodGain.connect(master);
    mood=name; step=0; sd=60/MOODS[name].bpm/2; nextT=t+0.08;
  }
  function sfx(name){
    if(!ctx||muted) return;
    var t=ctx.currentTime+0.01,d=sfxBus,k;
    if(name==='click') tone(d,'square',880,t,0.05,0.1);
    else if(name==='choice'){ tone(d,'square',660,t,0.08,0.13); tone(d,'square',990,t+0.08,0.14,0.13); }
    else if(name==='siren'){ for(k=0;k<4;k++) tone(d,'square',k%2?700:950,t+k*0.22,0.2,0.12); }
    else if(name==='arrest'){ noise(d,t,0.25,0.3,800); tone(d,'square',110,t,0.35,0.18,60); tone(d,'square',70,t+0.28,0.4,0.18,50); }
    else if(name==='ding'){ tone(d,'square',1320,t,0.12,0.12); tone(d,'square',1760,t+0.1,0.2,0.12); }
    else if(name==='flag'){ for(k=0;k<3;k++) tone(d,'sawtooth',k%2?330:440,t+k*0.18,0.16,0.12); }
    else if(name==='heart'){ for(k=0;k<3;k++){ tone(d,'sine',70,t+k*0.7,0.12,0.3,45); tone(d,'sine',70,t+k*0.7+0.2,0.12,0.22,45); } }
    else if(name==='cell'){ noise(d,t,0.12,0.3,2500); tone(d,'square',200,t,0.5,0.14,90); noise(d,t+0.35,0.3,0.25,600); }
    else if(name==='rewind') tone(d,'sawtooth',180,t,0.8,0.1,1800);
    else if(name==='clear'){ [72,76,79,84].forEach(function(m,j){ tone(d,'square',hz(m),t+j*0.12,0.3,0.13); }); }
  }
  function unlock(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=muted?0:VOL; master.connect(ctx.destination);
      sfxBus=ctx.createGain(); sfxBus.connect(master);
      noiseBuf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.5),ctx.sampleRate);
      var data=noiseBuf.getChannelData(0); for(var i=0;i<data.length;i++) data[i]=Math.random()*2-1;
      setInterval(function(){ schedule(ctx.currentTime+0.15); },30);
      var p=pending; pending=null; if(p) setMood(p);
    }
    if(ctx.state==='suspended'){ try{ var r=ctx.resume(); if(r&&r.catch) r.catch(function(){}); }catch(e){} }
  }
  document.addEventListener('visibilitychange',function(){
    if(!ctx||typeof ctx.suspend!=='function'||ctx.constructor.name==='OfflineAudioContext') return;
    try{ if(document.hidden) ctx.suspend(); else ctx.resume(); }catch(e){}
  });
  return {
    unlock:unlock,
    scene:function(n,silent){ setMood(moodOf(n)); if(!silent && SCENE_SFX[n]) sfx(SCENE_SFX[n]); },
    sfx:sfx,
    toggleMute:function(){
      muted=!muted;
      if(master) master.gain.setTargetAtTime(muted?0:VOL,ctx.currentTime,0.05);
      try{ localStorage.setItem('muted',muted?'1':'0'); }catch(e){}
      return muted;
    },
    isMuted:function(){return muted;},
    vol:function(d){ VOL=Math.max(0.1,Math.min(1.5,VOL+d)); if(master&&!muted) master.gain.setTargetAtTime(VOL,ctx.currentTime,0.05); return Math.round(VOL/0.9*100); },
    // 시험용
    pump:function(u){schedule(u);}, ctx:function(){return ctx;}
  };
})();
</script>

  var $ = function(id){return document.getElementById(id);};
  var img=$('img'), stage=$('stage'), cur=1, toastT=null;

  function parseHash(){
    var n = parseInt((location.hash||'').replace('#',''),10);
    return (n>=1 && n<=TOTAL) ? n : 1;
  }
  function toast(msg){
    var t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},3200);
  }
  function clearHot(){
    var hs=stage.querySelectorAll('.hot'); for(var i=0;i<hs.length;i++) stage.removeChild(hs[i]);
  }
  function render(){
    img.src = src(cur);
    img.alt = '장면 '+cur+' / '+TOTAL;
    clearHot();
    var ch = CHOICES[cur];
    if(ch){
      ch.forEach(function(c){
        var b=document.createElement('button');
        b.className='hot'+(c.pulse?' pulse':'');
        b.style.left=(c.x/16)+'%'; b.style.top=(c.y/9)+'%';
        b.style.width=(c.w/16)+'%'; b.style.height=(c.h/9)+'%';
        b.setAttribute('aria-label',c.label);
        b.addEventListener('click',function(e){
          e.stopPropagation();
          Snd.sfx('choice'); go(c.go);
        });
        stage.appendChild(b);
      });
    }
    var isChoice=!!ch, last=(cur===TOTAL);
    $('next').style.display = (isChoice||last)?'none':'';
    $('restart').style.display = last?'':'none';
    $('back').disabled = (cur===1);
    $('hint').textContent = HINTS[cur]||'';
    $('progi').style.width = (cur/TOTAL*100)+'%';
    $('count').textContent = cur+' / '+TOTAL;
    $('next').textContent = (cur===1)?'▶ START':'다음 ▶';
    showNote();
    // 앞뒤 장면 미리 불러오기
    [cur+1,cur+2].forEach(function(n){ if(n<=TOTAL){ var p=new Image(); p.src=src(n);} });
  }
  function go(n){
    if(n<1||n>TOTAL) return;
    cur=n;
    if(location.hash!=='#'+n){ try{history.replaceState(null,'','#'+n);}catch(e){location.hash=n;} }
    render();
    Snd.scene(n);
  }
  function next(){ if(CHOICES[cur]){ toast(HINTS[cur]); return; } if(cur<TOTAL){ Snd.sfx('click'); go(cur+1); } }
  function back(){ if(cur>1){ Snd.sfx('click'); go(cur-1); } }

  // 발표 버튼: 대본을 별도 창에 띄워 청중 화면에는 슬라이드만 보이게 함. 팝업이 막히면 화면 하단 패널로 표시
  var noteWin=null;
  function noteHtml(n){
    var d=NOTES[n]||{who:'',t:'',s:''};
    return {who:'발표자 '+d.who+' · 장면 '+n+'/'+TOTAL+' · '+d.t, txt:d.s};
  }
  function showNote(){
    var o=noteHtml(cur);
    if(noteWin && !noteWin.closed){
      try{ noteWin.document.getElementById('w').textContent=o.who; noteWin.document.getElementById('t').textContent=o.txt; }catch(e){}
    }
    $('noteWho').textContent=o.who; $('noteTxt').textContent=o.txt;
  }
  function toggleNotes(){
    var pn=$('notePanel');
    if(pn.classList.contains('show')){ pn.classList.remove('show'); return; }
    if(noteWin && !noteWin.closed){ noteWin.focus(); return; }
    noteWin=window.open('','notes','width=560,height=420');
    if(noteWin){
      noteWin.document.write('<!doctype html><meta charset="utf-8"><title>발표 대본</title><body style="margin:0;padding:18px;background:#0d0b1a;color:#fff;font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif"><div id="w" style="color:#ffc83d;font-weight:700;margin-bottom:10px"></div><div id="t" style="font-size:24px;line-height:1.7"></div></body>');
      noteWin.document.close(); showNote();
    } else { pn.classList.add('show'); showNote(); }
  }
  $('pres').addEventListener('click',toggleNotes);
  $('next').addEventListener('click',next);
  $('back').addEventListener('click',back);
  // 화면(슬라이드) 클릭으로도 다음 장면 이동 (선택 장면은 안내 문구만 표시)
  $('stage').addEventListener('click',function(){ next(); });
  $('restart').addEventListener('click',function(){go(1);});
  $('fs').addEventListener('click',toggleFs);
  function updMute(){ var m=Snd.isMuted(); $('mute').textContent=m?'🔇':'🔊'; $('mute').setAttribute('aria-pressed',m?'true':'false'); }
  function toggleMute(){ Snd.unlock(); Snd.toggleMute(); updMute(); }
  $('mute').addEventListener('click',toggleMute);
  // 브라우저 정책상 첫 클릭·키 입력 때 소리를 시작
  document.addEventListener('pointerdown',Snd.unlock,true);
  document.addEventListener('keydown',Snd.unlock,true);

  function toggleFs(){
    var d=document, el=d.documentElement;
    if(!d.fullscreenElement){ (el.requestFullscreen||function(){}).call(el); }
    else { d.exitFullscreen(); }
  }
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowRight'||k===' '||k==='Enter'||k==='PageDown'){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); back(); }
    else if(k==='f'||k==='F'){ toggleFs(); }
    else if(k==='r'||k==='R'){ go(1); }
    else if(k==='m'||k==='M'){ toggleMute(); }
    else if(k==='p'||k==='P'){ toggleNotes(); }
    else if(k==='ArrowUp'||k==='ArrowDown'){ e.preventDefault(); Snd.unlock(); toast('볼륨 '+Snd.vol(k==='ArrowUp'?0.1:-0.1)+'%'); }
    else if(k==='Home'){ go(1); }
    else if(CHOICES[cur] && (k==='1')){
      var c=CHOICES[cur][0]; if(c&&c.go) go(c.go);
    }
  });
  // 드래그·선택·우클릭 메뉴 차단
  ['selectstart','dragstart','contextmenu'].forEach(function(t){
    document.addEventListener(t,function(e){e.preventDefault();});
  });
  window.addEventListener('hashchange',function(){ var n=parseHash(); if(n!==cur){cur=n;render();Snd.scene(n,true);} });

  cur=parseHash(); render(); Snd.scene(cur,true); updMute();
  var first=new Image(); first.onload=first.onerror=function(){ var l=$('loading'); l.style.opacity=0; setTimeout(function(){l.style.display='none';},400); };
  first.src=src(cur);
})();
</script>
