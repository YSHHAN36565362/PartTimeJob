<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고수익 알바 시뮬레이션</title>
<meta name="description" content="당신의 선택이 엔딩을 결정합니다 — 고수익 알바 사기 예방 체험형 시뮬레이션">
<meta property="og:title" content="고수익 알바 시뮬레이션">
<meta property="og:description" content="당신의 선택이 엔딩을 결정합니다">
<meta property="og:image" content="slides/s01.webp">
<style>
  :root{--bar:64px;--bg:#0d0b1a;--accent:#ffc83d;--ink:#fff}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  ::selection{background:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}
  #stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0}
  #stage{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;
    width:min(100%, calc((100dvh - var(--bar)) * 16 / 9));background:#000}
  #stage img{pointer-events:none;position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .hot{position:absolute;border-radius:14px;cursor:pointer;background:transparent;border:0;padding:0;
    outline:0;transition:box-shadow .15s, background .15s}
  .hot:hover,.hot:focus-visible{background:rgba(255,200,61,.14);box-shadow:0 0 0 4px var(--accent)}
  .hot.pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,.0)}50%{box-shadow:0 0 0 6px rgba(255,200,61,.65)}}
  #bar{height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 14px;background:#15122b;border-top:1px solid #2c2750}
  #bar .spacer{flex:1}
  #prog{flex:1;max-width:420px;height:8px;background:#2c2750;border-radius:99px;overflow:hidden}
  #prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  #count{font-size:13px;color:#b9b4d8;min-width:48px}
  #hint{font-size:14px;color:var(--accent);font-weight:700;white-space:nowrap}
  button.b{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;
    background:#2c2750;color:#fff}
  button.b:hover{background:#3a3470}
  button.b.primary{background:var(--accent);color:#1b1500}
  button.b.primary:hover{filter:brightness(1.08)}
  button.b[disabled]{opacity:.35;cursor:default}
  #toast{position:fixed;left:50%;bottom:calc(var(--bar) + 18px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:rgba(20,16,44,.96);border:2px solid var(--accent);color:#fff;border-radius:12px;padding:12px 18px;
    font-size:clamp(14px,2vw,20px);max-width:92vw;text-align:center;transition:.25s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:18px;z-index:9;transition:opacity .4s}
  @media (max-width:640px){
    #prog,#count{display:none}
    #hint{font-size:12px;white-space:normal}
    button.b{padding:10px 12px;font-size:14px}
  }
</style>
</head>
<body>
<div id="loading">불러오는 중…</div>
<div id="app">
  <div id="stageWrap"><div id="stage"><img id="img" alt="" draggable="false"></div></div>
  <div id="bar">
    <button class="b" id="back" title="이전 (←)">◀ 이전</button>
    <div id="prog"><i id="progi"></i></div><span id="count"></span>
    <span class="spacer"></span>
    <span id="hint"></span>
    <button class="b primary" id="next" title="다음 (→ / Space)">다음 ▶</button>
    <button class="b" id="restart" title="처음부터 (R)" style="display:none">↻ 처음부터</button>
    <button class="b" id="fs" title="전체화면 (F)">⛶</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var TOTAL = 23;
  var pad = function(n){return (n<10?'0':'')+n;};
  var src = function(n){return 'slides/s'+pad(n)+'.webp';};

  // 선택 장면: 그림 속 버튼 위치(1600x900 기준 좌표) → 동작
  // 클릭 가능한 정답 버튼만 등록 (go: 이동할 장면)
  var CHOICES = {
    2: [
      {x:975,y:180,w:580,h:98,label:'아르바이트 앱 열기',go:3,pulse:true}
    ],
    4: [
      {x:815,y:738,w:742,h:138,label:'B 고수익 배달 알바',go:5,pulse:true}
    ],
    17: [
      {x:430,y:695,w:350,h:112,label:'리스폰',go:18,pulse:true}
    ]
  };
  var HINTS = {2:'화면의 버튼을 눌러 선택하세요',4:'[B 고수익 배달 알바]를 눌러 계속하세요',17:'[리스폰] 버튼을 눌러 계속하세요'};

  var $ = function(id){return document.getElementById(id);};
  var img=$('img'), stage=$('stage'), cur=1, toastT=null;

  function parseHash(){
    var n = parseInt((location.hash||'').replace('#',''),10);
    return (n>=1 && n<=TOTAL) ? n : 1;
  }
  function toast(msg){
    var t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},3200);
  }
  function clearHot(){
    var hs=stage.querySelectorAll('.hot'); for(var i=0;i<hs.length;i++) stage.removeChild(hs[i]);
  }
  function render(){
    img.src = src(cur);
    img.alt = '장면 '+cur+' / '+TOTAL;
    clearHot();
    var ch = CHOICES[cur];
    if(ch){
      ch.forEach(function(c){
        var b=document.createElement('button');
        b.className='hot'+(c.pulse?' pulse':'');
        b.style.left=(c.x/16)+'%'; b.style.top=(c.y/9)+'%';
        b.style.width=(c.w/16)+'%'; b.style.height=(c.h/9)+'%';
        b.setAttribute('aria-label',c.label);
        b.addEventListener('click',function(e){
          e.stopPropagation();
          go(c.go);
        });
        stage.appendChild(b);
      });
    }
    var isChoice=!!ch, last=(cur===TOTAL);
    $('next').style.display = (isChoice||last)?'none':'';
    $('restart').style.display = last?'':'none';
    $('back').disabled = (cur===1);
    $('hint').textContent = HINTS[cur]||'';
    $('progi').style.width = (cur/TOTAL*100)+'%';
    $('count').textContent = cur+' / '+TOTAL;
    $('next').textContent = (cur===1)?'▶ START':'다음 ▶';
    // 앞뒤 장면 미리 불러오기
    [cur+1,cur+2].forEach(function(n){ if(n<=TOTAL){ var p=new Image(); p.src=src(n);} });
  }
  function go(n){
    if(n<1||n>TOTAL) return;
    cur=n;
    if(location.hash!=='#'+n){ try{history.replaceState(null,'','#'+n);}catch(e){location.hash=n;} }
    render();
  }
  function next(){ if(CHOICES[cur]){ toast(HINTS[cur]); return; } if(cur<TOTAL) go(cur+1); }
  function back(){ if(cur>1) go(cur-1); }

  $('next').addEventListener('click',next);
  $('back').addEventListener('click',back);
  $('restart').addEventListener('click',function(){go(1);});
  $('fs').addEventListener('click',toggleFs);

  function toggleFs(){
    var d=document, el=d.documentElement;
    if(!d.fullscreenElement){ (el.requestFullscreen||function(){}).call(el); }
    else { d.exitFullscreen(); }
  }
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowRight'||k===' '||k==='Enter'||k==='PageDown'){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); back(); }
    else if(k==='f'||k==='F'){ toggleFs(); }
    else if(k==='r'||k==='R'){ go(1); }
    else if(CHOICES[cur] && (k==='1')){
      var c=CHOICES[cur][0]; if(c&&c.go) go(c.go);
    }
  });
  // 드래그·선택·우클릭 메뉴 차단
  ['selectstart','dragstart','contextmenu'].forEach(function(t){
    document.addEventListener(t,function(e){e.preventDefault();});
  });
  window.addEventListener('hashchange',function(){ var n=parseHash(); if(n!==cur){cur=n;render();} });

  cur=parseHash(); render();
  var first=new Image(); first.onload=first.onerror=function(){ var l=$('loading'); l.style.opacity=0; setTimeout(function(){l.style.display='none';},400); };
  first.src=src(cur);
})();
</script>
</body>
</html>
